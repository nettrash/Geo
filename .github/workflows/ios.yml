name: iOS CI

# Build, lint and test the Geo iOS/watchOS app.
# Requires a runner image with an Xcode that ships the iOS 26 SDK
# (the app targets iOS 26). `latest-stable` selects the newest Xcode
# installed on the runner.

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Xcode version
        run: xcodebuild -version
      - name: Build (app + Watch + widgets)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Geo.xcodeproj \
            -scheme Geo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  test:
    name: Unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pick an eligible iOS Simulator for the scheme
        id: sim
        # Use the scheme's own eligible destinations (correct iOS-26 runtime),
        # not `simctl list` which also returns older-OS sims the app can't target.
        #
        # Two failure modes are guarded here, both of which produced an EMPTY id
        # and therefore `-destination "platform=iOS Simulator,id="` — which
        # xcodebuild answers with its usage text and exit 64, hiding the cause.
        #
        #  1. The first `xcodebuild` invocation on a cold runner can return no
        #     destinations at all; a second call succeeds. Hence the retry.
        #  2. The runner image ships Xcode 26 but not necessarily the iOS 26
        #     *simulator runtime*. The app targets iOS 26, so without it the
        #     scheme has no eligible destination. Downloading it is several GB,
        #     so it is a last resort, attempted only after the retry.
        # NB: GitHub runs this with `bash -e`. `set -o pipefail` must NOT be used
        # here — `head -1` closes the pipe, upstream grep takes SIGPIPE, and the
        # combination aborts the step before any of the fallbacks below can run.
        # Every pick is therefore guarded with `|| true`; emptiness, not exit
        # status, is what we branch on.
        run: |
          set -u
          pick() {
            xcodebuild -showdestinations -project Geo.xcodeproj -scheme Geo 2>>/tmp/dst.err \
              | grep 'platform:iOS Simulator' | grep -v placeholder \
              | grep -oE 'id:[0-9A-Fa-f-]{36}' | head -1 | cut -d: -f2
          }
          id=$(pick || true)
          if [ -z "$id" ]; then
            echo "No destinations on the first call (cold start); retrying…"
            sleep 5
            id=$(pick || true)
          fi
          if [ -z "$id" ]; then
            echo "Still none; installing the iOS simulator runtime…"
            xcodebuild -downloadPlatform iOS || true
            id=$(pick || true)
          fi
          if [ -z "$id" ]; then
            echo "::error::No eligible iOS Simulator destination for scheme Geo."
            echo "--- xcodebuild stderr ---"; cat /tmp/dst.err || true
            echo "--- destinations ---"; xcodebuild -showdestinations -project Geo.xcodeproj -scheme Geo || true
            echo "--- installed runtimes ---"; xcrun simctl list runtimes || true
            exit 1
          fi
          echo "Using simulator destination id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Test (GeoTests)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Geo.xcodeproj \
            -scheme Geo \
            -only-testing:GeoTests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
